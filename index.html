<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title id="site-title">Portfolio</title>
    <meta name="description" content="" id="site-description" />
    <meta property="og:title" content="" id="og-title" />
    <meta property="og:description" content="" id="og-description" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="" id="og-url" />
    <meta property="og:image" content="" id="og-image" />
    <!-- Favicon / App Icons -->
    <link rel="icon" type="image/png" href="./assets/images/saqib_image.png" />
    <link rel="shortcut icon" type="image/png" href="./assets/images/saqib_image.png" />
    <link rel="apple-touch-icon" href="./assets/images/saqib_image.png" />

    <!-- TailwindCSS via CDN for speed of iteration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#4f46e5',
                dark: '#4338ca'
              }
            }
          }
        },
        darkMode: 'class'
      };
    </script>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body class="bg-white text-gray-800 dark:bg-gray-900 dark:text-gray-100">
    <!-- Header / Nav -->
    <header class="sticky top-0 z-40 backdrop-blur supports-backdrop-blur:bg-white/60 bg-white/80 dark:bg-gray-900/80 border-b border-gray-100 dark:border-gray-800">
      <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
        <a href="#home" class="font-semibold text-lg" id="nav-brand">My Portfolio</a>
        <nav class="hidden md:flex items-center gap-6" id="nav-links">
          <!-- Injected links -->
        </nav>
        <div class="flex items-center gap-3">
          <button id="dark-toggle" class="p-2 rounded-md border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800" aria-label="Toggle dark mode">🌙</button>
          <a id="resume-link-desktop" class="hidden md:block px-3 py-2 rounded-md bg-primary text-white hover:bg-primary-dark text-sm" href="#" target="_blank" rel="noopener">Resume</a>
          <button id="mobile-menu-toggle" class="md:hidden p-2 rounded-md border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800" aria-label="Toggle mobile menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
          </button>
        </div>
      </div>
      <!-- Mobile Menu -->
      <div id="mobile-menu" class="hidden md:hidden">
        <nav class="flex flex-col items-center gap-4 p-4" id="mobile-nav-links">
            <!-- Injected links for mobile -->
        </nav>
        <div class="p-4 border-t border-gray-100 dark:border-gray-800">
             <a id="resume-link-mobile" class="block w-full text-center px-3 py-2 rounded-md bg-primary text-white hover:bg-primary-dark text-sm" href="#" target="_blank" rel="noopener">Resume</a>
        </div>
      </div>
    </header>

    <main>
      <!-- Hero -->
      <section id="home" class="mx-auto max-w-6xl px-4 py-16 md:py-24 grid md:grid-cols-2 gap-10 items-center">
        <div>
          <h1 id="hero-title" class="text-4xl md:text-5xl font-extrabold leading-tight"></h1>
          <p id="hero-subtitle" class="mt-4 text-lg text-gray-600 dark:text-gray-300"></p>
          <div class="mt-6 flex gap-3" id="hero-ctas">
            <!-- Buttons injected -->
          </div>
          <div class="mt-6 flex gap-4 text-xl" id="social-links">
            <!-- Social icons injected -->
          </div>
        </div>
        <div class="flex justify-center md:justify-end">
          <img id="hero-image" src="" alt="Portrait" class="w-56 h-56 md:w-72 md:h-72 object-cover rounded-2xl shadow-lg border border-gray-100 dark:border-gray-800" />
        </div>
      </section>

      <!-- About -->
      <section id="about" class="section">
        <div class="section-bg-pattern"></div>
        <div class="section-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
        <div class="container">
          <h2 class="section-title">About</h2>
          <div id="about-cards" class="about-cards"></div>
          <div id="about-content" class="prose dark:prose-invert max-w-none"></div>
        </div>
        <div class="section-divider"></div>
      </section>

      <!-- Skills -->
      <section id="skills" class="section alt">
        <div class="section-bg-pattern"></div>
        <div class="section-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
        <div class="container">
          <h2 class="section-title">Skills</h2>
          <div id="skills-filters" class="skills-filters"></div>
          <div id="skills-list" class="skills-grid"></div>
        </div>
        <div class="section-divider"></div>
      </section>

      <!-- Experience -->
      <section id="experience" class="section alt">
        <div class="section-bg-pattern"></div>
        <div class="section-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
        <div class="container">
          <h2 class="section-title">Experience</h2>
          <ol id="experience-timeline" class="relative border-s border-gray-200 dark:border-gray-700"></ol>
        </div>
        <div class="section-divider"></div>
      </section>

      <!-- Projects -->
      <section id="projects" class="section">
        <div class="section-bg-pattern"></div>
        <div class="section-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
        <div class="container">
          <h2 class="section-title">Projects</h2>
          <div id="projects-grid" class="flex flex-col gap-6"></div>
        </div>
        <div class="section-divider"></div>
      </section>

      

      <!-- Contact -->
      <section id="contact" class="section alt">
        <div class="section-bg-pattern"></div>
        <div class="section-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>
        <div class="container">
          <h2 class="section-title">Contact</h2>
          <div id="contact-content" class="space-y-4"></div>
        </div>
      </section>
    </main>

    <footer class="border-t border-gray-100 dark:border-gray-800">
      <div class="mx-auto max-w-6xl px-4 py-8 text-sm text-gray-500 dark:text-gray-400 flex flex-col md:flex-row items-center justify-between gap-3">
        <div id="footer-text">© <span id="year"></span> <span id="site-owner"></span>. All rights reserved.</div>
        <div>Built with ❤️. <a class="underline hover:no-underline" href="#home">Back to top ↑</a></div>
      </div>
    </footer>

    <script src="./scripts/main.js" type="module"></script>
  </body>
</html>
