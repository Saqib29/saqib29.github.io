name: CI Pipeline

on:
  push:
    branches:
      - "*"
  pull_request:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Run lint checks
        run: pnpm lint

      - name: Build project
        run: pnpm build

      - name: Prepare dist folder
        run: |
          mkdir -p dist
          cp index.html blogs.html dist/
          cp -r scripts dist/
          cp -r styles dist/
          cp -r assets dist/
          cp -r data dist/

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: dist/
