<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blogs</title>
    <meta name="description" content="Blogs" />
    <link rel="icon" href="/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: { DEFAULT: '#4f46e5', dark: '#4338ca' }
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body class="bg-white text-gray-800 dark:bg-gray-900 dark:text-gray-100">
    <header class="sticky top-0 z-40 backdrop-blur supports-backdrop-blur:bg-white/60 bg-white/80 dark:bg-gray-900/80 border-b border-gray-100 dark:border-gray-800">
      <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
        <a href="index.html#home" class="font-semibold text-lg" id="nav-brand">My Portfolio</a>
        <nav class="hidden md:flex items-center gap-6" id="nav-links">
          <!-- Injected links -->
        </nav>
        <div class="flex items-center gap-3">
          <button id="dark-toggle" class="p-2 rounded-md border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800" aria-label="Toggle dark mode">🌙</button>
          <a id="resume-link" class="px-3 py-2 rounded-md bg-primary text-white hover:bg-primary-dark text-sm" href="#" target="_blank" rel="noopener">Resume</a>
        </div>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <h1 class="section-title">Blogs</h1>
          <div id="profile-buttons" class="mb-6 flex flex-wrap gap-3"></div>
          <div id="blogs-grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
      </section>
    </main>

    <footer class="border-t border-gray-100 dark:border-gray-800">
      <div class="mx-auto max-w-6xl px-4 py-8 text-sm text-gray-500 dark:text-gray-400 flex flex-col md:flex-row items-center justify-between gap-3">
        <div>© <span id="year"></span> <span id="site-owner"></span>. All rights reserved.</div>
        <div>Built with ❤️. <a class="underline hover:no-underline" href="#top">Back to top ↑</a></div>
      </div>
    </footer>

    <script src="./scripts/blogs.js" type="module"></script>
  </body>
</html>
